<!doctype html>
<html lang="cs" data-theme="light">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="text-scale" content="scale" />
		<title>Pražský přebor mužů – statistiky</title>
		<script>
			// Apply the saved light/dark choice before the first paint (no flash).
			try {
				var t = localStorage.getItem('pps.theme');
				if (t === 'system') document.documentElement.removeAttribute('data-theme');
				else if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
			} catch (e) {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
